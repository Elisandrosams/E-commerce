<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css"/>
    <script
      src="https://kit.fontawesome.com/9169ad0fbb.js"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
    <script src="books.js"></script>
  </head>
  <body id="books__body">
    <section>
      <nav>
        <div class="nav__container">
          <img class="logo" src="assets/Library.svg" alt="Library graphic" />
          <ul class="nav__links">
            <li><a class="nav__link" href="./index.html">Home</a></li>
            <li><a class="nav__link no-cursor" href="">Contact</a></li>
            <li>
              <a class="nav__link nav__link--primary" href="#featured">Books</a>
            </li>
          </ul>
          <button class="btn__menu" onclick="openMenu()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
              <i class="fa-solid fa-times"></i>
            </button>
            <ul class="menu__links">
              <li class="Menu__list">
                <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
              </li>
              <li class="Menu__list">
                <a href="#featured" class="menu__link" onclick="closeMenu()"
                  >Books</a
                >
              </li>
              <li class="Menu__list">
                <a class="menu__link no-cursor" onclick="closeMenu()"
                  >Contact</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </section>
    <main>
      <section>
        <div class="container">
          <div class="row">
            <div class="books__header">
              <h2 class="section__title books__header--title">
                All <span class="purple">Books</span>
              </h2>
              <select id="filter" onchange="filterBooks(event)">
                <option value="" disabled selected>Sort</option>
                <option value="LOW_TO_HIGH">Price, Low to High</option>
                <option value="HIGH_TO_LOW">Price, High to Low</option>
                <option value="RATING">Rating</option>
              </select>
            </div>
            <div class="books books__loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer id="footer">
      <div class="container">
        <div class="row">
          <div class="footer__container">
            <a href="#">
              <figure>
                <img
                  class="footer__logo"
                  src="assets/Library.svg"
                  alt="library graphic"
                />
              </figure>
            </a>
            <ul class="footer__links">
              <li><a class="footer__link" href="./index.html">Home</a></li>
              <li><a class="footer__link no-cursor" href="">About</a></li>
              <li><a class="footer__link no-cursor" href="">Contact</a></li>
              <li><a class="footer__link" href="#">Books</a></li>
            </ul>
            <p class="footer__para">Copyright © 2026 Library</p>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
